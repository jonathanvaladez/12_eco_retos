<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Eco-Guía | Eco-Retos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <span class="navbar-brand fw-bold">🌿 Panel Eco-Guía (Admin)</span>
            <div class="d-flex align-items-center">
                <span id="infoUsuario" class="text-white me-3 fw-bold"></span>
                <button class="btn btn-sm btn-danger fw-bold" onclick="cerrarSesion()">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white fw-bold">Crear Nuevo Eco-Reto</div>
                    <div class="card-body">
                        <form id="formReto">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Título del Reto</label>
                                <input type="text" id="tituloReto" class="form-control" placeholder="Ej. Día sin plástico" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Descripción</label>
                                <textarea id="descReto" class="form-control" rows="2" placeholder="Ej. Evitar bolsas y botellas desechables" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Puntos de Recompensa</label>
                                <input type="number" id="puntosReto" class="form-control" min="1" placeholder="Ej. 50" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold">Guardar Reto</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <h4 class="mb-3">Retos Ecológicos Registrados</h4>
                <div id="listaRetosGuia" class="row">
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            verificarAcceso('Eco-Guía');
            mostrarRetosGuia();
        });
        document.getElementById('formReto').addEventListener('submit', crearReto);
    </script>
</body>
</html>
