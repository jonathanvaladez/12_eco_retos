<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Ciudadano | Eco-Retos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand fw-bold">🌎 Zona Ciudadano</span>
            <div class="d-flex align-items-center">
                <span id="infoUsuario" class="text-white me-3 fw-bold"></span>
                <button class="btn btn-sm btn-danger fw-bold" onclick="cerrarSesion()">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Retos Disponibles</h3>
            <span class="badge bg-success fs-5">Mis Puntos: <span id="totalPuntos">0</span> pts</span>
        </div>

        <div id="listaRetosCiudadano" class="row">

        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            verificarAcceso('Ciudadano');
            mostrarRetosCiudadano();
        });
    </script>
</body>
</html>
